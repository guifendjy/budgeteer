<template s-if="$store.BudgetStore.low_balance_alert">
    <div class="pt-5 mt-5 border-t border-app-border/30">
        <div class="flex gap-4 p-4 bg-status-overdue/5 border border-status-overdue/20 rounded-2xl items-start">

            <div class="hidden sm:flex shrink-0 w-8 h-8 rounded-full bg-status-overdue/10 items-center justify-center">
                <svg class="w-4 h-4 text-status-overdue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>

            <div class="space-y-1 min-w-0 flex-1">
                <p class="text-xs sm:text-sm font-black text-status-overdue uppercase tracking-tight">
                    Low Balance Alert — Projected <span
                        s-text="$store.BudgetStore.low_balance_alert?.projectedDate"></span>
                </p>

                <p class="text-[10px] sm:text-xs text-app-muted leading-relaxed">
                    Balance is projected to dip to
                    <span class="font-mono font-bold text-status-overdue"
                        s-text="$store.HelpersStore.$formatCurrency($store.BudgetStore.low_balance_alert?.dipAmount, $store.UserStore.settings.currency)">
                    </span>
                    before payday.
                    <span s-text="$store.BudgetStore.low_balance_alert?.triggerBill"></span>
                    (<span class="font-mono font-bold"
                        s-text="$store.HelpersStore.$formatCurrency($store.BudgetStore.low_balance_alert?.triggerAmount, $store.UserStore.settings.currency)"></span>)
                    is <span class="font-bold text-app-text"
                        s-text="$store.BudgetStore.low_balance_alert?.triggerDate"></span>.
                </p>
            </div>
        </div>
    </div>
</template>
