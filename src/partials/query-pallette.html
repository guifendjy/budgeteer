<!-- query pallette -->
<div s-show="isExpanded"
    class="absolute top-full left-2 right-2 sm:left-0 sm:right-0 mx-auto mt-2 max-w-xl bg-app-card border border-app-border rounded-2xl shadow-xl z-40 overflow-hidden transition-all">
    <!-- add bill action-->
    <div s-show="query.length > 0" class="expanded-container p-2 border-b border-app-border bg-brand-soft/30">
        <div on:click="()=>{
        const bill = parseBillQuery(query);
        if(!bill.valid) {
            $store.ToastStore.add('Invalid bill query', 'error');
            return;
        }
        $store.BillStore.add(bill);
        $store.ToastStore.add('bill added');
        query = ''; // clear the query input.
        }"
            class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 p-3 rounded-xl hover:bg-brand-soft cursor-pointer transition-colors border border-transparent hover:border-brand-accent/20">

            <div
                class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 p-3 rounded-xl bg-brand-soft cursor-pointer transition-colors border border-brand-accent/20">

                <div class="flex items-start gap-3 w-full min-w-0">
                    <div
                        class="w-8 h-8 rounded-lg bg-brand-primary text-white flex items-center justify-center font-bold shrink-0">
                        +
                    </div>

                    <div class="min-w-0 flex-1 space-y-1">
                        <p class="text-xs font-bold text-brand-primary">Create New Bill</p>

                        <p s-class="!parseBillQuery(query)?.valid ? 'text-status-danger' : 'text-app-muted'"
                            class="text-[11px] min-w-0 flex flex-wrap gap-x-2 gap-y-0.5 leading-relaxed">
                            <span class="inline-block">Parsing: <span class="font-semibold text-app-text"
                                    s-text="parseBillQuery(query).name"></span></span>
                            <span class="inline-block">for <span class="font-semibold text-app-text"
                                    s-text="$store.HelpersStore.$formatCurrency(parseBillQuery(query).amount, $store.UserStore.settings.currency)"></span></span>
                            <span class="inline-block">due <span class="font-semibold text-app-text"
                                    s-text="$store.HelpersStore.$formatDate(parseBillQuery(query).due_date, {relative: false})"></span></span>
                            <span
                                class="inline-block text-[10px] uppercase tracking-wide bg-app-border/30 px-1 rounded font-bold"
                                s-text="parseBillQuery(query).recurrence"></span>
                        </p>

                        <template s-for="missing in parseBillQuery(query).missing">
                            <p class="text-[10px] text-status-danger/80 pt-0.5">
                                Missing: <span class="capitalize" s-text="missing"></span>
                            </p>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- query quick actions -->
    <div s-show="query.length === 0" class="p-4 space-y-3">
        <div class="rounded-lg border border-app-border bg-app-bg/50 p-2.5 flex items-center gap-2">
            <svg width="10" class="w-3.5 h-3.5 text-app-muted shrink-0" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>

            <p class="text-[11px] text-app-muted">
                name · amount · due date · recurrence <i>(default: monthly)</i><br>
                <b>try:</b> <span class="text-brand-primary font-mono">"Netflix 17.99 29th monthly"</span> or <span
                    class="text-brand-primary font-mono">"Rent 1200 1st"</span>
            </p>
        </div>
        <p class="text-[10px] font-bold text-app-muted uppercase tracking-widest">Quick Commands</p>
        <div class="grid grid-cols-1 gap-2">
            <button on:click="query = 'Electric 85' "
                class="text-left p-2 rounded-lg hover:bg-app-bg text-xs border border-transparent hover:border-app-border transition-all">
                <span class="text-brand-primary font-mono">"Electric 85"</span>
                <span class="text-app-muted"> — Add <span
                        s-text="$store.HelpersStore.$formatCurrency(85, $store.UserStore.settings.currency)"></span>
                    electric bill</span>
            </button>
            <button on:click="query = 'Rent 1200 1st'"
                class="text-left p-2 rounded-lg hover:bg-app-bg text-xs border border-transparent hover:border-app-border transition-all">
                <span class="text-brand-primary font-mono">"Rent 1200 1st"</span>
                <span class="text-app-muted"> — Add rent due on the 1st</span>
            </button>
        </div>
    </div>

    <!-- query search results -->
    <div s-show="query.length > 0" class="max-h-60 overflow-y-auto p-2 space-y-1">
        <div class="px-3 py-2 flex justify-between items-center">
            <span class="text-[10px] font-black text-app-muted uppercase tracking-widest">Found in Records</span>
            <span class="text-[10px] text-app-muted/50"
                s-text="`${filterBills($store.BillStore.bills, query).length} matches`"></span>
        </div>

        <template s-for="bill in filterBills($store.BillStore.bills, query)">
            <!-- select a bill -->
            <div on:click="$store.SelectedBillStore.selectBill(bill)"
                class="group flex items-center justify-between p-3 rounded-xl hover:bg-app-bg border border-transparent hover:border-app-border transition-all cursor-pointer">

                <div class="flex items-center gap-3">
                    <div
                        class="w-1.5 h-1.5 rounded-full bg-brand-primary/40 group-hover:bg-brand-primary transition-colors">
                    </div>
                    <div class="flex flex-col">
                        <span s-text="bill.name"
                            class="font-bold text-app-text group-hover:text-brand-primary transition-colors"></span>
                        <span class="text-[10px] text-app-muted capitalize" s-text="bill?.metadata?.category"></span>
                    </div>
                </div>

                <div class="flex items-center gap-4 text-right">
                    <span
                        class="hidden sm:block px-2 py-0.5 rounded-md bg-app-bg text-app-muted text-[9px] font-bold uppercase tracking-tighter"
                        s-text="bill.recurrence"></span>

                    <div class="flex flex-col items-end min-w-15">
                        <span class="text-xs font-black text-app-text"
                            s-text="`${bill.currency} ${bill.amount}`"></span>
                        <span class="text-[9px] text-app-muted font-medium" s-text="formatDate(bill.due_date)"></span>
                    </div>
                </div>
            </div>
        </template>

        <div s-show="filterBills($store.BillStore.bills, query).length === 0"
            class="py-8 text-center bg-app-bg  rounded-xl border border-dashed border-app-border">
            <p class="text-xs font-bold text-app-muted">No records found for "<span s-text="query"
                    class="text-app-text"></span>"</p>
            <p class="text-[10px] text-app-muted/60 mt-1">Check your spelling or add it as a new bill above.</p>
        </div>
    </div>
</div>
