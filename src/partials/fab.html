<div s-state="{ open:false }" class="fixed bottom-5 right-5 lg:hidden">

    <!-- Expanded split -->
    <div s-class="open ? 'flex' : 'hidden'" class="bg-app-bg rounded-full p-2 shadow-md border border-app-border
           items-center gap-1 transition-all duration-200">

        <!-- LEFT HALF -->
        <button class="bg-app-card text-app-text p-3 rounded-l-full 
             border border-app-border
             hover:bg-app-bg active:scale-95 transition"
            on:click="()=> { open=false; $store.OpenPanelStore.setPanel('left') }">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="6" height="18" rx="1" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8M13 12h8M13 17h8" />
            </svg>
        </button>

        <!-- RIGHT HALF -->
        <button class="bg-app-card text-app-text p-3 rounded-r-full 
             border border-app-border
             hover:bg-app-bg active:scale-95 transition"
            on:click="()=> { open=false; $store.OpenPanelStore.setPanel('right') }">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M7 14l4-4 3 3 5-5" />
            </svg>
        </button>

    </div>


    <!-- Collapsed FAB -->
    <button s-state="{timerId: null}" s-class="open ? 'hidden' : 'flex'" on:click="()=> {
        open = true;
        if(timerId) {
            clearTimeout(timerId);
            return;
        }
        timerId = setTimeout(() => {
            open=false;
            timerId = null;
        }, 2000);
    }" class="size-12 bg-brand-primary text-white 
           rounded-full shadow-lg
           items-center justify-center
           hover:scale-105 active:scale-95
           transition">
        <!-- split icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 12h16" />
        </svg>
    </button>

</div>
