<!-- use local storage to persist notifications -->
<div class="fixed inset-0 z-100">
    <div on:click="notificationsOpen = false" class="fixed inset-0 bg-slate-500/10 backdrop-blur-sm">
    </div>
    <aside id="notifications-panel"
        class="fixed top-0 right-0 h-full w-[85%] max-w-95 bg-app-card border-l border-app-border/40 z-110 flex flex-col rounded-l-4xl shadow-2xl">

        <div class="pt-16 px-10 pb-8 flex items-center justify-between">
            <h2 class="text-2xl font-light text-app-text tracking-tight">Notifications</h2>
            <button on:click="notificationsOpen = false" id="close-notifications"
                class="p-2 text-app-muted hover:text-app-text transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-6 space-y-3">

            <!-- list of all notifications(from notif store) -->

            <div
                class="group relative p-5 bg-app-bg/40 border border-app-border/20 rounded-3xl hover:border-brand-primary/30 transition-all cursor-pointer">
                <div class="flex items-start gap-4">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-start justify-between gap-3">
                            <!-- title -->
                            <p class="text-xs font-bold text-app-text">Safe-to-Spend Trend</p>
                            <!-- date -->
                            <span class="shrink-0 text-[8px] font-mono text-app-muted uppercase">May 09</span>
                        </div>
                        <!-- message -->
                        <p class="mt-2 text-[10px] text-app-muted leading-relaxed">Your daily spending has averaged 15% lower this week. Your weekend forecast is healthy.</p>
                    </div>
                    <button type="button" aria-label="Remove notification"
                        class="shrink-0 text-[9px] font-black text-app-muted hover:text-red-500 uppercase tracking-wider transition-colors">
                        Remove
                    </button>
                </div>
            </div>

        </div>

        <div class="p-8 border-t border-app-border/10">
            <!-- clear all notifications button -->
            <button
                class="w-full py-3 text-[9px] font-black text-app-muted hover:text-brand-primary uppercase tracking-[0.3em] transition-colors">
                Clear All Notifications
            </button>
        </div>
    </aside>
</div>
