<!-- query field -->
<div class="relative group z-50">
    <input s-ref="queryInput" on:focus="isExpanded = true" s-value="query" type="text" on:input="query = $target.value"
        placeholder="Search bills or add 'Name Amount Date Recurrence'..." class="w-full pl-10 pr-4 py-2 bg-app-bg border border-app-border rounded-xl text-xs font-mono tracking-tight
               focus:ring-4 focus:ring-brand-primary/5 focus:border-app-border-hover 
               outline-none transition-all">

    <span class="absolute left-3 top-2.5 text-app-muted">
        <template s-if="query.match(/\d+/)">
            <svg class="w-4 h-4 text-brand-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </template>
        <template s-if="!query.match(/\d+/)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </template>
    </span>
</div>
