<!-- main head -->
<div
    class="bg-app-card border border-app-border rounded-4xl p-6 sm:p-10 max-w-3xl mx-auto relative overflow-hidden shadow-xl flex flex-col items-center">
    <div class="sm:mb-8 w-full max-w-md">
        <div class="flex items-center justify-center gap-3 mb-4">
            <div class="h-px w-4 bg-brand-primary/20"></div>
            <p class="text-[9px] font-black text-brand-primary tracking-[0.3em] uppercase">Inflow Parameters</p>
            <div class="h-px w-4 bg-brand-primary/20"></div>
        </div>

        <div class="w-full max-w-md mx-auto">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-y-8 sm:gap-y-0 items-start max-w-4xl mx-auto">

                <div s-state="FieldEditState"
                    class="flex flex-col sm:items-end sm:pr-10 sm:border-r sm:border-app-border/20">

                    <div class="h-4 flex items-center justify-center sm:justify-end">
                        <p class="text-[8px] font-black text-app-muted uppercase tracking-widest">
                            Paycheck
                        </p>
                    </div>

                    <div class="h-12 flex items-center justify-center sm:justify-end gap-2 group">
                        <h2 s-show="activeField !== 'check'"
                            class="text-lg font-mono font-bold text-app-text tracking-tight">
                            <span
                                s-text="$store.HelpersStore.$formatCurrency($store.BudgetStore.next_deposit_amount, $store.UserStore.settings.currency)"></span>
                        </h2>

                        <input s-show="activeField === 'check'" on:change="activeFieldValue = parseFloat($target.value)"
                            s-effect-focus type="number" s-value="$store.BudgetStore.next_deposit_amount"
                            class="bg-transparent border-b border-brand-primary outline-none font-mono font-bold text-lg text-app-text w-24 text-center sm:text-right">

                        <div on:click="setActiveField('check', (v)=> $store.BudgetStore.updateInflowParams('next_deposit_amount', v ))"
                            class="cursor-pointer">
                            {{> edit-component }}
                        </div>
                    </div>

                    <div class="h-6 flex items-center justify-center sm:justify-end" s-state="FieldEditState">
                        <span s-show="activeField !== 'recurrence'"
                            class="text-[9px] font-bold text-app-muted uppercase"
                            s-text="$store.BudgetStore.pay_frequency">
                        </span>

                        <select on:change="activeFieldValue = $target.value" s-show="activeField === 'recurrence'"
                            s-effect-focus s-value="$store.SelectedBillStore.bill.recurrence"
                            class="bg-transparent border-b-2 border-brand-soft outline-none font-mono text-sm text-app-text w-auto text-right uppercase cursor-pointer scheme-dark">
                            <option value="monthly">Monthly</option>
                            <option value="bi-weekly">Bi-Weekly</option>
                            <option value="weekly">Weekly</option>
                        </select>
                        <div on:click="setActiveField('recurrence', (v)=> $store.BudgetStore.updateInflowParams('pay_frequency', v))"
                            class="cursor-pointer ml-1">
                            {{> edit-component }}
                        </div>
                    </div>
                </div>

                <div s-state="FieldEditState" class="flex flex-col sm:items-start sm:pl-10">

                    <div class="h-4 flex items-center justify-center sm:justify-start">
                        <p class="text-[8px] font-black text-app-muted uppercase tracking-widest">
                            Next Deposit
                        </p>
                    </div>

                    <div class="h-12 flex items-center justify-center sm:justify-start gap-2 group">
                        <h2 s-show="activeField !== 'date'"
                            class="text-lg font-mono font-bold text-app-text tracking-tight">
                            <span
                                s-text="$store.HelpersStore.$formatDate($store.BudgetStore.next_deposit_date, { relative: false, prefix: false })"></span>
                        </h2>

                        <input on:change="activeFieldValue = $target.value" s-show="activeField === 'date' "
                            s-effect-focus type="date"
                            s-value="$store.HelpersStore.$formatDate($store.BudgetStore.next_deposit_date, { relative: false, prefix: false, format:'YYYY-MM-DD' })"
                            class="bg-transparent rounded-lg font-mono font-bold text-xs text-app-text border border-app-border/50 px-2 py-1 outline-none focus:border-brand-primary transition-all">

                        <div on:click="setActiveField('date', (v)=> $store.BudgetStore.updateInflowParams('next_deposit_date', v))"
                            class="cursor-pointer">
                            {{> edit-component }}
                        </div>
                    </div>

                    <div class="h-6 flex items-center justify-center sm:justify-start">
                        <p class="text-[9px] font-bold text-brand-primary uppercase">
                            Est. Monthly: <span class="text-app-text/60"
                                s-text="$store.HelpersStore.$formatCurrency($store.BudgetStore.monthly_income_anchor, $store.UserStore.settings.currency)"></span>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="relative py-6 w-full">
        <div class="absolute inset-0 bg-brand-primary/5 blur-[50px] rounded-full"></div>

        <div class="relative z-10 text-center">
            <div s-state="{open: false}" on:click="()=>{open=!open; setTimeout(()=>open=false,1000*5)}"
                class="relative flex gap-2 items-center justify-center group">
                <p class="text-sm font-light text-app-muted tracking-wide uppercase text-center">SAFE-TO-SPEND
                </p>
                <div s-hover="open = !open"
                    class="cursor-help text-brand-primary/40 hover:text-brand-primary transition-colors duration-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>

                {{> safe-to-spend-tooltip }}
            </div>

            <h1 class="text-5xl sm:text-6xl lg:text-7xl font-bold font-mono tracking-tighter leading-tight"
                s-scroll-text="$store.HelpersStore.$formatCurrency($store.BudgetStore.safe_to_spend, $store.UserStore.settings.currency)">
            </h1>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-0 mt-8 pt-8 border-t border-app-border/20 w-full max-w-md">
        <div class="text-center border-r border-app-border/20">
            <p class="text-[9px] font-black text-app-muted uppercase tracking-widest mb-1">In Bank</p>
            <div s-state="FieldEditState" class="flex items-center justify-center">
                <p s-show="activeField != 'in-bank' " class="text-lg font-mono font-bold text-app-text/90"
                    s-text="$store.HelpersStore.$formatCurrency($store.BudgetStore.cleared_balance, $store.UserStore.settings.currency)">
                </p>

                <input on:change="activeFieldValue = parseFloat($target.value)" s-show="activeField === 'in-bank' "
                    s-effect-focus type="number" s-value="$store.BudgetStore.cleared_balance"
                    class="bg-transparent border-b border-brand-primary outline-none font-mono font-bold text-lg text-app-text w-24 text-center sm:text-right">

                <div on:click="setActiveField('in-bank', (v)=> $store.BudgetStore.updateInflowParams('cleared_balance', v))"
                    class="cursor-pointer">
                    {{> edit-component }}
                </div>
            </div>
        </div>

        <div class="text-center">
            <p class="text-[9px] font-black text-app-muted uppercase tracking-widest mb-1">Obligations</p>
            <p class="text-lg pb-5 font-mono font-bold text-status-overdue"
                s-scroll-text="$store.HelpersStore.$formatCurrency($store.BudgetStore.total_obligations, $store.UserStore.settings.currency)">
            </p>
        </div>
        <p class="text-app-muted text-[10px]">

        </p>
    </div>

    {{> low-balance-alert }}
</div>

<!-- only for paid tier users -->
<div class="max-w-3xl mx-auto">
    {{> chart }}
</div>

<div class="max-w-3xl mx-auto">
    {{> selected-bill }}
</div>
